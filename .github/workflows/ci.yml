name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock psutil
          pip install -e . --no-deps
      - name: Tests (unit, integration, real-capture validation, fuzz/property)
        run: python -m pytest -q
      - name: Fixture ground-truth validation
        run: python -m tests.robustness.validate_fixtures
      - name: Static security analysis (bandit)
        run: python -m bandit -r securemailscope -q
      - name: Dependency vulnerabilities (pip-audit)
        run: python -m pip_audit -r requirements.lock --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
